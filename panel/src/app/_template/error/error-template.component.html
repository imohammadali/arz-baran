<div class="flex items-center justify-center min-h-screen overflow-hidden">
  <div class="flex flex-col items-center justify-center">
    <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, color-mix(in srgb, var(--primary-color), transparent 60%) 10%, var(--surface-ground) 30%)">
      <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20 flex flex-col items-center" style="border-radius: 53px">
        <!-- Error Title -->
        <span class="text-primary font-bold text-4xl">۴۰۴</span>
        <h1 class="text-surface-900 dark:text-surface-0 font-bold text-2xl lg:text-4xl mb-2" translate="notFound.title"></h1>
        <div class="text-surface-600 dark:text-surface-200 mb-8" translate="notFound.description"></div>
        <div class="w-full">
          @if (isLoggedIn()) {
            <p-button [fluid]="true" routerLink="/home" severity="primary" class="w-full">{{ 'notFound.backHome' | translate }}</p-button>
          } @else {
            <p-button [fluid]="true" routerLink="/auth" severity="primary" class="w-full">{{ 'notFound.backLogin' | translate }}</p-button>
          }
        </div>
      </div>
    </div>
  </div>
</div>
