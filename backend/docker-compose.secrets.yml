# Override: staging-shaped secret file mounts (no plaintext passwords in env).
#
# Setup:
#   mkdir -p secrets
#   cp secrets/postgres_password.example secrets/postgres_password
#   cp secrets/redis_password.example secrets/redis_password
#   cp secrets/jwt_secret.example secrets/jwt_secret
#   chmod 0400 secrets/*
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d

services:
  api:
    secrets:
      - postgres_password
      - redis_password
      - jwt_secret
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_PASSWORD: ""
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_SECRET: ""
      JWT_SECRET_FILE: /run/secrets/jwt_secret

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  jwt_secret:
    file: ./secrets/jwt_secret
