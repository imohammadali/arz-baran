services:
  postgres:
    image: postgres:16-alpine
    container_name: arz-baran-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arz_baran
      POSTGRES_USER: arz_baran
      POSTGRES_PASSWORD: arz_baran
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arz_baran -d arz_baran"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arz-baran-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
