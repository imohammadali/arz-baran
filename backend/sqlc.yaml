version: "2"

sql:
  - engine: postgresql
    schema: sql/schema/
    queries: sql/queries/platform/
    gen:
      go:
        package: platformdb
        out: gen/sqlc/platform/
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  - engine: postgresql
    schema: sql/schema/
    queries: sql/queries/iam/
    gen:
      go:
        package: iamdb
        out: gen/sqlc/iam/
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  - engine: postgresql
    schema: sql/schema/
    queries: sql/queries/instrument/
    gen:
      go:
        package: instrumentdb
        out: gen/sqlc/instrument/
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

  - engine: postgresql
    schema: sql/schema/
    queries: sql/queries/wallet/
    gen:
      go:
        package: walletdb
        out: gen/sqlc/wallet/
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
